async function loadGroups() {

data: { user }
} = await supabaseClient.auth.getUser();
if (!user) {
document.getElementById('groupList').innerHTML = '';
return;
}
  const { data, error } = await supabaseClient
    .from('groups')
    .select('*')
    .eq('owner_id', user.id)
  const list = document.getElementById('groupList');
  list.innerHTML = '';
  if (error) {
    console.log(error);
    return;
  }
  data.forEach(group => {
    const li = document.createElement('li');
    li.textContent = group.name;
    li.style.cursor = 'pointer';
    li.onclick = () => {
      currentGroupId = group.id;
      document.getElementById('selectedGroup').textContent =
        `Vald grupp: ${group.name}`;
      console.log('Vald grupp:', group.id);
      loadMembers();
      loadExpenses();
    };
    list.appendChild(li);
  });
}

async function loadMembers() {

    option.textContent = member.name;

function calculate() {
const balances = {};
people.forEach(p => {
balances[p] = 0;
});
expenses.forEach(e => {
const share = e.amount / people.length;
balances[e.payer] += e.amount;
people.forEach(p => {
balances[p] -= share;
});
});
// Visa saldon
let html =
'<table><tr><th>Person</th><th>Saldo</th></tr>';
Object.entries(balances).forEach(([p, b]) => {
html += `
<tr>
<td>${p}</td>
<td>${b.toFixed(2)} kr</td>
</tr>
`;
});
html += '</table>';
document.getElementById('balances').innerHTML = html;
// Beräkna betalningar
const creditors = [];
const debtors = [];
Object.entries(balances).forEach(([name, amount]) => {
if (amount > 0.01) {
creditors.push({
name: name,
amount: amount
});
}
if (amount < -0.01) {
debtors.push({
name: name,
amount: Math.abs(amount)
});
}
});
const payments = [];
let i = 0;
let j = 0;
while (
i < debtors.length &&
j < creditors.length
) {
const debtor = debtors[i];
const creditor = creditors[j];
const payment = Math.min(
debtor.amount,
creditor.amount
);
payments.push(
`${debtor.name} ska betala ${payment.toFixed(2)} kr till ${creditor.name}`
);
debtor.amount -= payment;
creditor.amount -= payment;
if (debtor.amount < 0.01) {
i++;
}
if (creditor.amount < 0.01) {
j++;
}
}

const paidTotals = {};
people.forEach(p => {
paidTotals[p] = 0;
});
expenses.forEach(e => {
paidTotals[e.payer] += e.amount;
});
const totalExpenses =
expenses.reduce(
(sum, e) => sum + e.amount,
0
);
const averagePerPerson =
people.length
? totalExpenses / people.length
: 0;
let summaryHtml = '';
Object.entries(paidTotals).forEach(([name, amount]) => {
summaryHtml += `
<div>
<strong>${name}</strong> har lagt ut
${amount.toFixed(2)} kr
</div>
`;
});
summaryHtml += `
<hr>
<div>
<strong>Totalt utlagt:</strong>
${totalExpenses.toFixed(2)} kr
</div>
<div>
<strong>Per person:</strong>
${averagePerPerson.toFixed(2)} kr
</div>
`;
document.getElementById('summary').innerHTML =
summaryHtml;
  
document.getElementById('settlements').innerHTML =
payments.length
? payments.join('<br>')
: 'Alla saldon är reglerade.';
}

checkUser();
